<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Interativo - Informações Coordenadores</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-group label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .control-group input,
        .control-group select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            color: #333;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: white;
            overflow-x: auto;
        }

        .tab-button {
            padding: 15px 20px;
            border: none;
            background: white;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-button:hover {
            background: #f8f9fa;
            color: #667eea;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .content {
            padding: 30px;
            min-height: 500px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
        }

        .chart-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: 700;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 700;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            color: #555;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr:nth-child(even) {
            background: #fafbfc;
        }

        .footer {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }

            .btn-group {
                margin-left: 0;
                width: 100%;
            }

            .btn {
                flex: 1;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 20px;
            }

            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard Interativo - Coordenadores</h1>
            <p><span class="status-indicator"></span>Gráficos e análises em tempo real</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="coordenadorFilter">👤 Coordenador:</label>
                <select id="coordenadorFilter">
                    <option value="">Todos</option>
                    <option value="RAILDA">RAILDA</option>
                    <option value="RENATA">RENATA</option>
                    <option value="ANDERSON">ANDERSON</option>
                    <option value="VICTÓRIA">VICTÓRIA</option>
                </select>
            </div>

            <div class="control-group">
                <label for="monthFilter">📅 Mês:</label>
                <select id="monthFilter">
                    <option value="">Todos</option>
                </select>
            </div>

            <div class="control-group">
                <label for="yearFilter">📆 Ano:</label>
                <select id="yearFilter">
                    <option value="">Todos</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="refreshDashboard()">🔄 Atualizar</button>
                <button class="btn btn-secondary" onclick="exportToCSV()">📥 Exportar</button>
            </div>
        </div>

        <div class="tabs" id="tabsContainer">
            <!-- Tabs serão geradas dinamicamente -->
        </div>

        <div class="content" id="contentContainer">
            <!-- Conteúdo será gerado dinamicamente -->
        </div>

        <div class="footer">
            <p>Última atualização: <span id="lastUpdate">--:--</span> | Dashboard com dados sincronizados</p>
        </div>
    </div>

    <script>
        // Dados embutidos
        const SHEET_DATA = {
            "RAILDA - IMOB": [],
            "RAILDA - HOUSE": [],
            "RENATA - IMOB": [],
            "RENATA - HOUSE": [],
            "ANDERSON - IMOB": [],
            "ANDERSON - HOUSE": [],
            "VICTÓRIA - IMOB": [],
            "VICTÓRIA - HOUSE": []
        };

        let allData = {};
        let currentTab = 'dashboard';
        let charts = {};

        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            initializeDashboard();
        });

        function setupEventListeners() {
            document.getElementById('coordenadorFilter').addEventListener('change', refreshDashboard);
            document.getElementById('monthFilter').addEventListener('change', refreshDashboard);
            document.getElementById('yearFilter').addEventListener('change', refreshDashboard);
        }

        function initializeDashboard() {
            // Carregar dados da URL
            fetch('dados_js.js')
                .then(response => response.text())
                .then(text => {
                    // Extrair dados do arquivo JS
                    const match = text.match(/const SHEET_DATA = ({[\s\S]*});/);
                    if (match) {
                        allData = JSON.parse(match[1]);
                        populateTabs();
                        populateFilters();
                        displayTab('dashboard');
                        updateLastUpdate();
                    }
                })
                .catch(error => {
                    console.error('Erro ao carregar dados:', error);
                    // Usar dados padrão se o arquivo não existir
                    allData = SHEET_DATA;
                    populateTabs();
                    populateFilters();
                    displayTab('dashboard');
                });
        }

        function populateTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';
            
            const tabs = ['dashboard', ...Object.keys(allData)];
            tabs.forEach(tabName => {
                const button = document.createElement('button');
                button.className = 'tab-button' + (tabName === currentTab ? ' active' : '');
                button.textContent = tabName === 'dashboard' ? '📊 Dashboard' : tabName;
                button.onclick = () => displayTab(tabName);
                tabsContainer.appendChild(button);
            });
        }

        function populateFilters() {
            const months = new Set();
            const years = new Set();
            
            Object.values(allData).forEach(data => {
                if (Array.isArray(data)) {
                    data.forEach(row => {
                        if (row['MÊS']) months.add(row['MÊS'].trim());
                        if (row['ANO']) years.add(row['ANO'].trim());
                    });
                }
            });
            
            const monthSelect = document.getElementById('monthFilter');
            monthSelect.innerHTML = '<option value="">Todos</option>';
            Array.from(months).sort().forEach(month => {
                const option = document.createElement('option');
                option.value = month;
                option.textContent = month;
                monthSelect.appendChild(option);
            });
            
            const yearSelect = document.getElementById('yearFilter');
            yearSelect.innerHTML = '<option value="">Todos</option>';
            Array.from(years).sort().reverse().forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            });
        }

        function displayTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(tabName === 'dashboard' ? 'Dashboard' : tabName)) {
                    btn.classList.add('active');
                }
            });
            
            if (tabName === 'dashboard') {
                renderDashboard();
            } else {
                renderTableTab(tabName);
            }
        }

        function getFilteredData() {
            const coordenador = document.getElementById('coordenadorFilter').value;
            const month = document.getElementById('monthFilter').value;
            const year = document.getElementById('yearFilter').value;
            
            let filteredData = [];
            
            Object.entries(allData).forEach(([sheetName, data]) => {
                if (!Array.isArray(data)) return;
                if (coordenador && !sheetName.includes(coordenador)) return;
                
                data.forEach(row => {
                    let matches = true;
                    
                    if (month && row['MÊS']?.trim() !== month) matches = false;
                    if (year && row['ANO']?.trim() !== year) matches = false;
                    
                    if (matches) {
                        filteredData.push({...row, _sheetName: sheetName});
                    }
                });
            });
            
            return filteredData;
        }

        function refreshDashboard() {
            if (currentTab === 'dashboard') {
                renderDashboard();
            }
        }

        function renderDashboard() {
            const data = getFilteredData();
            const contentContainer = document.getElementById('contentContainer');
            
            if (data.length === 0) {
                contentContainer.innerHTML = '<p style="text-align: center; padding: 40px;">Nenhum dado encontrado</p>';
                return;
            }
            
            // Calcular estatísticas
            let totalVendas = 0;
            let totalVGV = 0;
            let totalConfirmadas = 0;
            let totalEmProcesso = 0;
            
            data.forEach(row => {
                Object.entries(row).forEach(([key, value]) => {
                    if (key.includes('QTD VENDA') && !key.includes('CONFIRMADA') && !key.includes('PROCESSO')) {
                        totalVendas += parseInt(value) || 0;
                    }
                    if (key === 'VGV') {
                        const num = parseFloat(String(value).replace(/[^\d,.-]/g, '').replace(',', '.'));
                        totalVGV += num || 0;
                    }
                    if (key.includes('CONFIRMADA')) {
                        totalConfirmadas += parseInt(value) || 0;
                    }
                    if (key.includes('PROCESSO')) {
                        totalEmProcesso += parseInt(value) || 0;
                    }
                });
            });
            
            let html = '<div class="stats-grid">';
            html += `<div class="stat-card"><h4>Total de Vendas</h4><div class="value">${totalVendas}</div></div>`;
            html += `<div class="stat-card"><h4>VGV Total</h4><div class="value">R$ ${(totalVGV / 1000000).toFixed(1)}M</div></div>`;
            html += `<div class="stat-card"><h4>Confirmadas</h4><div class="value">${totalConfirmadas}</div></div>`;
            html += `<div class="stat-card"><h4>Em Processo</h4><div class="value">${totalEmProcesso}</div></div>`;
            html += '</div>';
            
            html += '<div class="dashboard-grid">';
            html += '<div class="chart-card"><h3>📈 Vendas por Mês</h3><div class="chart-container"><canvas id="chartVendasMes"></canvas></div></div>';
            html += '<div class="chart-card"><h3>🏢 Vendas por Empreendimento</h3><div class="chart-container"><canvas id="chartEmpreendimento"></canvas></div></div>';
            html += '<div class="chart-card"><h3>👥 Comparação entre Coordenadores</h3><div class="chart-container"><canvas id="chartCoordenadores"></canvas></div></div>';
            html += '<div class="chart-card"><h3>💰 Evolução de VGV</h3><div class="chart-container"><canvas id="chartVGV"></canvas></div></div>';
            html += '</div>';
            
            contentContainer.innerHTML = html;
            
            setTimeout(() => {
                createCharts(data);
            }, 100);
        }

        function createCharts(data) {
            const vendidosPorMes = {};
            const vendidosPorEmpreendimento = {};
            const vendidosPorCoordenador = {};
            const vgvPorMes = {};
            
            data.forEach(row => {
                const mes = row['MÊS']?.trim() || 'Sem mês';
                const empreendimento = row['EMPREENDIMENTO'] || 'Sem empreendimento';
                const coordenador = row._sheetName?.split(' - ')[0] || 'Desconhecido';
                
                let vendas = 0;
                let vgv = 0;
                
                Object.entries(row).forEach(([key, value]) => {
                    if (key.includes('QTD VENDA') && !key.includes('CONFIRMADA') && !key.includes('PROCESSO')) {
                        vendas += parseInt(value) || 0;
                    }
                    if (key === 'VGV') {
                        const num = parseFloat(String(value).replace(/[^\d,.-]/g, '').replace(',', '.'));
                        vgv += num || 0;
                    }
                });
                
                vendidosPorMes[mes] = (vendidosPorMes[mes] || 0) + vendas;
                vendidosPorEmpreendimento[empreendimento] = (vendidosPorEmpreendimento[empreendimento] || 0) + vendas;
                vendidosPorCoordenador[coordenador] = (vendidosPorCoordenador[coordenador] || 0) + vendas;
                vgvPorMes[mes] = (vgvPorMes[mes] || 0) + vgv;
            });
            
            const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a', '#fee140', '#30b0fe'];
            
            // Gráfico de Vendas por Mês
            const ctxMes = document.getElementById('chartVendasMes');
            if (ctxMes) {
                if (charts.vendasMes) charts.vendasMes.destroy();
                charts.vendasMes = new Chart(ctxMes, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(vendidosPorMes),
                        datasets: [{
                            label: 'Vendas',
                            data: Object.values(vendidosPorMes),
                            backgroundColor: colors[0],
                            borderColor: colors[0],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: true } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }
            
            // Gráfico de Vendas por Empreendimento
            const ctxEmpreendimento = document.getElementById('chartEmpreendimento');
            if (ctxEmpreendimento) {
                if (charts.empreendimento) charts.empreendimento.destroy();
                charts.empreendimento = new Chart(ctxEmpreendimento, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(vendidosPorEmpreendimento),
                        datasets: [{
                            data: Object.values(vendidosPorEmpreendimento),
                            backgroundColor: colors
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
            }
            
            // Gráfico de Comparação entre Coordenadores
            const ctxCoordenadores = document.getElementById('chartCoordenadores');
            if (ctxCoordenadores) {
                if (charts.coordenadores) charts.coordenadores.destroy();
                charts.coordenadores = new Chart(ctxCoordenadores, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(vendidosPorCoordenador),
                        datasets: [{
                            label: 'Vendas por Coordenador',
                            data: Object.values(vendidosPorCoordenador),
                            backgroundColor: colors.slice(0, Object.keys(vendidosPorCoordenador).length)
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }
            
            // Gráfico de Evolução de VGV
            const ctxVGV = document.getElementById('chartVGV');
            if (ctxVGV) {
                if (charts.vgv) charts.vgv.destroy();
                charts.vgv = new Chart(ctxVGV, {
                    type: 'line',
                    data: {
                        labels: Object.keys(vgvPorMes),
                        datasets: [{
                            label: 'VGV (R$ Milhões)',
                            data: Object.values(vgvPorMes).map(v => v / 1000000),
                            borderColor: colors[1],
                            backgroundColor: 'rgba(118, 75, 162, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: true } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }
        }

        function renderTableTab(tabName) {
            const data = allData[tabName] || [];
            const contentContainer = document.getElementById('contentContainer');
            
            if (!Array.isArray(data) || data.length === 0) {
                contentContainer.innerHTML = '<p style="text-align: center; padding: 40px;">Nenhum dado encontrado</p>';
                return;
            }
            
            const headers = Object.keys(data[0]);
            let html = '<div class="table-wrapper"><table>';
            html += '<thead><tr>';
            headers.forEach(header => {
                html += `<th>${header}</th>`;
            });
            html += '</tr></thead><tbody>';
            
            data.forEach((row, idx) => {
                html += `<tr style="background: ${idx % 2 === 0 ? '#fafbfc' : 'white'};">`;
                headers.forEach(header => {
                    html += `<td>${row[header] || ''}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            contentContainer.innerHTML = html;
        }

        function exportToCSV() {
            const data = getFilteredData();
            if (data.length === 0) {
                alert('Nenhum dado para exportar');
                return;
            }
            
            const headers = Object.keys(data[0]).filter(k => !k.startsWith('_'));
            let csv = headers.join(',') + '\n';
            data.forEach(row => {
                const values = headers.map(header => {
                    let value = row[header] || '';
                    if (String(value).includes(',') || String(value).includes('"')) {
                        value = '"' + String(value).replace(/"/g, '""') + '"';
                    }
                    return value;
                });
                csv += values.join(',') + '\n';
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `dashboard_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function updateLastUpdate() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('pt-BR');
            document.getElementById('lastUpdate').textContent = timeString;
        }
    </script>
</body>
</html>
